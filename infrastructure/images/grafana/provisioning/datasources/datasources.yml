apiVersion: 1

# Same UIDs as local/, so the shared dashboards find their data sources. The hosts are Cloud Map names.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.observability.internal:9090
    isDefault: true
    jsonData:
      timeInterval: 10s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki.observability.internal:3100
