# Loaded by FireLens next to the config it generates. Every record is a line the backend wrote to
# stdout; the backend logs JSON, so parse it to get at the level.
# LOKI_HOST, LOG_GROUP and AWS_REGION come from the task definition.

# FireLens's generated config loads no parsers, so load the image's own, which has `json`.
[SERVICE]
    Parsers_File /fluent-bit/parsers/parsers.conf

[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       json
    Reserve_Data On

# Same labels as the Alloy pipeline in local/: service, plus the log level.
[OUTPUT]
    Name        loki
    Match       *
    Host        ${LOKI_HOST}
    Port        3100
    Labels      service=backend
    Label_keys  $level
    Remove_keys container_id,container_name,source,ecs_cluster,ecs_task_arn,ecs_task_definition
    Line_format json

# A copy in CloudWatch, for when Loki itself is down.
[OUTPUT]
    Name              cloudwatch_logs
    Match             *
    region            ${AWS_REGION}
    log_group_name    ${LOG_GROUP}
    log_stream_prefix backend/
    auto_create_group false
