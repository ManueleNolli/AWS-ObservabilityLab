[project]
name = "observability-lab"
version = "0.1.0"
description = "Demo API that turns user clicks into Prometheus metrics and JSON logs."
authors = [
    { name = "Manuele Nolli", email = "me@manuelenolli.ch" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.4",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
observability-lab = "observability_lab.__main__:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
