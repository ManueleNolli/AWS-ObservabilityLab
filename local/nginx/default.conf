# Local stand-in for CloudFront: static files at /, API at /api/.
server {
    listen 80;
    root /usr/share/nginx/html;

    # index.html points at the current build's assets, so browsers must always revalidate it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Built assets have a content hash in their name, so they never change and can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
