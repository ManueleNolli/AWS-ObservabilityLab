name: Deploy

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region for every resource. To change it on a deployed stack, run Destroy first.
        type: choice
        options: [eu-central-2, eu-central-1]
        default: eu-central-2
      monitoring_mode:
        description: managed needs eu-central-1 (Amazon Managed Grafana isn't in Zurich).
        type: choice
        options: [self_hosted, managed]
        default: self_hosted
      image_tag:
        description: Image tag (a git SHA) to deploy instead of building the current commit's images.
        type: string
        required: false

# Deploy and Destroy share the main stack's state: never run two at once, never cancel one halfway.
concurrency:
  group: terraform-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # Builds whatever images the commit doesn't have yet; images that exist are skipped in seconds.
  # Not with an explicit image_tag: an older tag can't be rebuilt from this commit.
  build:
    name: Build images
    if: inputs.image_tag == ''
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      id-token: write

  deploy:
    name: Deploy main stack
    needs: build
    # Also when build was skipped because of an explicit image_tag, but not when it failed.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/main
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_VAR_region: ${{ inputs.region }}
      TF_VAR_monitoring_mode: ${{ inputs.monitoring_mode }}
      TF_VAR_image_tag: ${{ inputs.image_tag || github.sha }}
    steps:
      # First: the job's working directory only exists after checkout.
      - uses: actions/checkout@v7

      # The apply role only trusts main; say so instead of failing on an AWS error.
      - name: Check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy only runs from main, not ${GITHUB_REF#refs/heads/}."
          exit 1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}

      - name: Init
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="region=$TF_STATE_REGION"

      # Terraform doesn't move resources between regions: it would create new ones and leave the
      # old ones running, unmanaged.
      - name: Check region
        run: |
          # -json, because -raw prints a warning to stdout when there are no outputs yet.
          deployed="$(terraform output -json | jq -r '.region.value // empty')"
          if [[ -n "$deployed" && "$deployed" != "$TF_VAR_region" ]]; then
            echo "::error::The stack is deployed in $deployed. Run Destroy before deploying to $TF_VAR_region."
            exit 1
          fi

      # Needed for an explicit image_tag, and in the replica region, where ECR copies new images
      # within a few minutes: wait for them instead of failing.
      - name: Check images
        env:
          ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
        run: |
          images=(backend)
          if [[ "$TF_VAR_monitoring_mode" == self_hosted ]]; then
            images+=(prometheus loki grafana fluent-bit)
          else
            images+=(adot)
          fi
          # ECR lives in the state bucket's region; anywhere else the images are replicas.
          attempts=1
          [[ "$TF_VAR_region" != "$TF_STATE_REGION" ]] && attempts=20
          for attempt in $(seq "$attempts"); do
            missing=()
            for image in "${images[@]}"; do
              repository="${ECR_REPOSITORY_PREFIX#*/}/$image"
              if ! aws ecr describe-images --region "$TF_VAR_region" --repository-name "$repository" \
                --image-ids "imageTag=$TF_VAR_image_tag" >/dev/null 2>&1; then
                missing+=("$repository:$TF_VAR_image_tag")
              fi
            done
            (( ${#missing[@]} == 0 )) && exit 0
            if (( attempt < attempts )); then
              echo "Waiting for ${missing[*]} in $TF_VAR_region ($attempt/$attempts)"
              sleep 15
            fi
          done
          echo "::error::Not in ECR in $TF_VAR_region: ${missing[*]}."
          exit 1

      - name: Plan
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          {
            echo "## Deploy: $TF_VAR_region, $TF_VAR_monitoring_mode, images $TF_VAR_image_tag"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Applies exactly the plan above, and waits until every service is healthy.
      - name: Apply
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Read outputs
        run: |
          outputs="$(terraform output -json)"
          {
            echo "URL=$(jq -r '.url.value' <<<"$outputs")"
            echo "GRAFANA_URL=$(jq -r '.grafana_url.value // empty' <<<"$outputs")"
            echo "FRONTEND_BUCKET=$(jq -r '.frontend_bucket.value' <<<"$outputs")"
            echo "DISTRIBUTION_ID=$(jq -r '.distribution_id.value' <<<"$outputs")"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Grafana is on the same distribution, so its link is a path, not a URL.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_GRAFANA_URL: ${{ inputs.monitoring_mode == 'self_hosted' && '/grafana' || '' }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Vite puts a content hash in every asset name, so assets are cached forever; index.html,
      # which points at them, is never cached.
      - name: Upload frontend
        working-directory: frontend
        run: |
          aws s3 sync dist/ "s3://$FRONTEND_BUCKET/" --delete --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://$FRONTEND_BUCKET/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths /index.html >/dev/null
          {
            echo "## Deployed"
            echo "- App: $URL"
            if [[ -n "$GRAFANA_URL" ]]; then echo "- Grafana: $GRAFANA_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
